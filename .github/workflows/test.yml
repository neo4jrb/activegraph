name: Test

on:
  push:
    branches: [ '12' ]
    # Housekeeping-only changes (docs, changelog, version bump) can't affect
    # tests — skip the heavy CI on them. A mixed change still runs (paths-ignore
    # skips only when EVERY changed file matches).
    paths-ignore: ['**/*.md', 'lib/active_graph/version.rb']
  pull_request:
    branches: [ '12' ]
    paths-ignore: ['**/*.md', 'lib/active_graph/version.rb']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: [ jruby, ruby ]
        neo4j: [ 2026.07.1 ]
        active_model: [ 7.1.6, 7.2.3.2, 8.0.5.1, 8.1.3.1 ]
        include:
          - ruby: jruby
            java-version: 21
    env:
      NEO4J_VERSION: ${{ matrix.neo4j }}
      ACTIVE_MODEL_VERSION: ${{ matrix.active_model }}
      JRUBY_OPTS: --debug -J-Xmx1280m -Xcompile.invokedynamic=false -J-XX:+TieredCompilation -J-XX:TieredStopAtLevel=1 -J-noverify -Xcompile.mode=OFF
    steps:
      - name: Start neo4j
        run: docker run --name neo4j --env NEO4J_AUTH=neo4j/password --env NEO4J_ACCEPT_LICENSE_AGREEMENT=yes --env NEO4J_dbms_directories_import= -p7687:7687 -p7474:7474 -v `pwd`/tmp:/var/lib/neo4j/import --rm neo4j:${{ matrix.neo4j }}-enterprise &

      - uses: actions/checkout@v4

      # Java must be set up before JRuby: JRuby 10.x is compiled for Java 21,
      # so initializing it on the runner's default JDK fails with
      # UnsupportedClassVersionError and leaves a broken gem environment.
      - name: Set up Java
        uses: actions/setup-java@v3
        if: matrix.java-version
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install dependencies
        run: bundle update

      - name: Wait for neo4j
        run: while [ $((curl localhost:7474/ > /dev/null 2>&1); echo $?) -ne 0 ]; do sleep 1; done

      - name: Run tests
        run: bundle exec rspec

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}

#      - name: Run tests
#        run: bundle exec rubocop

  # Stable aggregator context to require in branch protection — its name never
  # changes when the matrix (ruby / neo4j / active_model versions) is bumped.
  build-success:
    name: build-success
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.test.result != 'success' }}
        run: |
          echo "test matrix: ${{ needs.test.result }}"; exit 1
